server:
  port: 8080

spring:
  application:
    name: llm-gateway
  # WebFlux 默认使用 Netty，无需额外配置
  codec:
    # 上调最大 in-memory buffer，防止大请求体被截断
    max-in-memory-size: 10MB

  # ==========================================
  # Redis 配置（阶段二：TPM 限流）
  # ==========================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 连接超时，Redis 不可用时快速失败，触发 fail-open 降级
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        llm.gateway.ttft: true
        llm.gateway.stream.duration: true

# ==========================================
# LLM 网关配置
# ==========================================
llm:
  gateway:
    # ==========================================
    # 入口鉴权：Key 映射到可信 tenantId
    # ==========================================
    auth:
      enabled: ${GATEWAY_AUTH_ENABLED:true}
      api-keys:
        demo: ${GATEWAY_DEMO_API_KEY:}

    # ==========================================
    # 阶段四：模型注册表（替换单 target-url）
    # ==========================================
    models:
      deepseek-v4-flash:
        target-url: https://api.deepseek.com
        api-key: ${LLM_API_KEY:your-api-key-here}
        thinking: false
        max-context: 64000
      deepseek-v4-flash-thinking:
        target-url: https://api.deepseek.com
        api-key: ${LLM_API_KEY:your-api-key-here}
        thinking: true
        max-context: 64000
      deepseek-v4-pro:
        target-url: https://api.deepseek.com
        api-key: ${LLM_API_KEY:your-api-key-here}
        thinking: true
        max-context: 128000
      qwen3-1-7b:
        target-url: http://localhost:11434
        api-key: ollama
        thinking: false
        max-context: 32000
        request-model: qwen3:1.7b

    # 路由表：intent（小写）→ modelId。含 default 兜底
    routing:
      code: deepseek-v4-flash
      reasoning: deepseek-v4-flash-thinking
      math: deepseek-v4-pro
      translation: deepseek-v4-flash
      writing: deepseek-v4-flash
      chitchat: qwen3-1-7b
      default: deepseek-v4-flash

    # 差异化 Fallback：默认第二个独立 Ollama 实例；生产可改为另一云提供商
    fallback:
      target-url: ${FALLBACK_TARGET_URL:http://localhost:11435}
      model: ${FALLBACK_MODEL:qwen3-1-7b}
      request-model: ${FALLBACK_REQUEST_MODEL:qwen3:1.7b}
      api-key: ${FALLBACK_API_KEY:ollama}

    # TTFT 超时阈值（首 content/reasoning 帧）。超时 → cancel 主通道 + 切 fallback + 记 failure
    ttft-slo-ms: 3000
    ttft-slo-thinking-ms: 10000
    xlong-threshold: 32000

    # Resilience4j CircuitBreaker（按 model 粒度 named breaker，关 slow-call 判定）
    circuit-breaker:
      sliding-window-size: 100
      minimum-number-of-calls: 20
      failure-rate-threshold: 50
      wait-duration-in-open-state-ms: 60000
      permitted-half-open-calls: 10

    # WebClient 通用超时（主链路 + fallback 共用主 webClient bean）
    connect-timeout-ms: 5000
    read-timeout-ms: 120000

    # TPM 令牌桶限流配置（每用户每分钟最大 Token 数）
    tpm-capacity: 100000
    tpm-refill-rate-per-second: 1667
    tpm-bucket-ttl-seconds: 0          # 0 = max(120, read-timeout-ms/1000+60)

    # 主链路 SSE 连接池（默认 HttpClient.create() 仅 ~500，撑不住 C10K 叙事）
    web-client-max-connections: 4000
    web-client-pending-acquire-max-count: 8000
    ollama-web-client-max-connections: 200

    # 语义缓存配置
    qdrant-host: ${QDRANT_HOST:localhost}
    qdrant-port: 6334
    qdrant-collection: llm_cache
    embedding-dimension: 1024          # BGE-M3 维度
    semantic-cache-threshold: 0.95
    semantic-cache-ttl-seconds: 86400  # 0 关闭过期过滤；无 created_at 的旧点会被 range 排除
    stream-simulate-delay-ms: 20

    # Embedding 模型（Ollama 本地部署）
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-embed-model: ${OLLAMA_EMBED_MODEL:bge-m3}
    ollama-read-timeout-ms: 30000      # Embedding 短 POST，无需 120s
    embed-pipeline-timeout-ms: 3000    # 顶部 embed fail-open，不堵 SSE 响应头
    prototype-retry:
      initial-delay-ms: 1000
      max-delay-ms: 30000
      jitter: 0.2

logging:
  level:
    com.llmgateway: DEBUG
    reactor.netty: INFO
